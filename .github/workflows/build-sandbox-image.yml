name: Build and Push Vercel Sandbox Image

on:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile.sandbox'
      - '.github/workflows/build-sandbox-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-push:
    name: Build & Push Dedicated Transcription Sandbox Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Inspect GitHub OIDC claims (Diagnostic)
        run: |
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https://vercel.com" | python3 -c "import sys, json; print(json.load(sys.stdin).get('value', ''))")
          python3 -c "
          import sys, base64, json
          token = sys.argv[1]
          parts = token.split('.')
          if len(parts) >= 2:
              payload_b64 = parts[1]
              payload_b64 += '=' * (-len(payload_b64) % 4)
              data = json.loads(base64.urlsafe_b64decode(payload_b64).decode('utf-8'))
              keys = ['iss', 'aud', 'sub', 'repository', 'repository_id', 'repository_owner', 'repository_owner_id', 'ref', 'event_name']
              filtered = {k: data.get(k) for k in keys}
              print('=== DECODED GITHUB OIDC CLAIMS ===')
              print(json.dumps(filtered, indent=2))
              print('==================================')
          " "$TOKEN"

      - name: Log in to Vercel Container Registry (OIDC)
        uses: vercel/vcr-action/login@v1
        with:
          team: ${{ vars.VERCEL_TEAM_ID }}

      - name: Build and push Sandbox image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.sandbox
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            vcr.vercel.com/${{ vars.VERCEL_TEAM_SLUG }}/${{ vars.VERCEL_PROJECT_SLUG }}/${{ vars.VCR_REPOSITORY }}:latest
